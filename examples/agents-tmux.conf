# Add set -g @plugin 'ahmad9059/AgentsTmux' before TPM initialization.
# Source this file before loading the plugin.
set -g @sidebar_single_window on
set -g @sidebar_icon_running '⟳'
set -g @sidebar_icon_background '◌'
set -g @sidebar_icon_waiting 'Ⅱ'
set -g @sidebar_icon_idle '✓'
set -g @sidebar_icon_error '✕'
set -g @sidebar_color_idle '#4caf50'
set -g @sidebar_color_waiting '#ffb74d'
set-environment -g AGENTSTMUX_SHOW_PREVIEWS 0

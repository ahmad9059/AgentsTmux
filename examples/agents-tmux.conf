# Optional overrides. AgentsTmux works without any of these; the values shown
# are the built-in defaults. Set them in ~/.tmux.conf before the plugin loads.
set -g @sidebar_single_window on
set -g @sidebar_width 32
# agents (default): only windows named Agents/Agent; on: every new window; off: never
set -g @sidebar_auto_create agents

# Status icons. Unset by default: working shows an animated braille spinner,
# background work an orbiting dot, "needs you" a blinking dot, ready a ring.
# Setting an icon replaces its animation with that fixed glyph.
# set -g @sidebar_icon_running '⠋'
# set -g @sidebar_icon_idle '○'
# set -g @sidebar_icon_waiting '●'
# set -g @sidebar_icon_error '◉'
# Status colors: xterm-256 index or #RRGGBB.
# set -g @sidebar_color_running '#e5c07b'
# set -g @sidebar_color_background '#61afef'
# set -g @sidebar_color_waiting '#ff9e64'
# set -g @sidebar_color_idle '#98c379'
# set -g @sidebar_color_error '#f7768e'
# Thin lines around the sidebar heading (dimmed on top of this color).
# set -g @sidebar_color_divider '#005f87'

# Sound effects when an agent finishes or needs you (see README).
# set -g @sidebar_sound on
# set -g @sidebar_sound_done /path/to/done.wav
# set -g @sidebar_sound_request /path/to/request.wav
set-environment -g AGENTSTMUX_SHOW_PREVIEWS 0
